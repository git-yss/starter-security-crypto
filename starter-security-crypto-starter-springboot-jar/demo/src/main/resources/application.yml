server:
  port: 8080

security:
  crypto:
    enabled: true
    environment: dev
    key-version: V1
    algorithm: AES_GCM
    api-sign:
      enabled: false
      window-seconds: 300
    replay:
      enabled: true
      window-seconds: 300
    audit:
      enabled: true
      max-body-length: 4096
    field-encrypt:
      enabled: true

logging:
  level:
    SECURITY_AUDIT: INFO
